name: expense_tracker
description: "Smart Expense Tracker & KhataBook with SMS Sync, Dynamic Analytics and PDF Export"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (BLoC)
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local Database - ObjectBox
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

  # Notifications & Permissions
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.2
  flutter_sms_inbox: ^1.0.3

  # Routing
  go_router: ^18.0.1

  # Dynamic Charts & PDF Export
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0

  # Storage & Utilities
  bot_toast: ^4.1.3
  shimmer: ^4.0.0
  flutter_svg: ^2.0.17
  google_fonts: ^8.2.1
  logger: ^2.5.0
  intl: ^0.20.2
  timezone: ^0.11.1
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.1
  flutter_native_contact_picker: ^0.0.12
  local_auth: ^2.3.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  injectable_generator: ^3.0.2
  json_serializable: ^6.9.5
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
